<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset your password | ScamShield</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/reset-password.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-row">
      <a class="brand" href="/">Scam<span class="brand-accent">Shield</span></a>
    </div>
  </header>
  <main class="checker reset-panel">
    <h1>Reset your password</h1>
    <p id="reset-help">Choose a password of 10 to 128 characters.</p>
    <noscript><p>Enable JavaScript to reset your password.</p></noscript>
    <form id="reset-form" class="scan-entry" method="post" hidden>
      <div>
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required aria-describedby="reset-help">
      </div>
      <div>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" maxlength="128" required>
      </div>
      <button class="button primary" type="submit">Reset password</button>
    </form>
    <p id="reset-status" class="status-message" role="status"></p>
    <p><a href="/">Back to ScamShield</a></p>
  </main>
</body>
</html>
